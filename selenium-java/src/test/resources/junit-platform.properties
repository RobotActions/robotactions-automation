cucumber.junit-platform.naming-strategy=long
cucumber.publish.quiet=true

# Glue — Cucumber must scan this package for @Given/@When/@Then classes.
# The runner's @ConfigurationParameter also sets this, but the properties
# file acts as a fallback for forked JVMs that may not inherit the runner.
cucumber.glue=com.example.tests.steps

# Parallel execution defaults — load.sh overrides these via -D flags.
# Setting them here ensures forked JVMs start from a known baseline.
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=1

# Failure-reason capture. Registered here as well as on the runner so a forked
# JVM (load.sh runs one per shard) still gets it — without the plugin the After
# hook falls back to the scenario NAME as the failure reason, which restates
# the test title and says nothing about the cause.
cucumber.plugin=com.example.tests.support.FailureCapture
