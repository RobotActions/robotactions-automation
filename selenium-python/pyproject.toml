[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.41.0",
    "Appium-Python-Client>=4.5.1",
    "pytest>=8.3.0",
    "pytest-bdd>=8.1.0",
    "pytest-html>=4.1.0",
    "pytest-json-report>=1.5.0",
    "allure-pytest-bdd==2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features/"
addopts = "-v --tb=short --junitxml=reports/junit.xml --alluredir=reports/allure-results"
markers = [
    "smoke: quick sanity tests",
    "sanity: broader functional coverage — superset of smoke",
    "regression: full coverage — superset of sanity (default Feature tag)",
    "health: cross-cutting health / load-runner cycle",
    "web: scenarios that target a desktop browser",
    "android: scenarios that target an Android device or emulator",
    "ios: scenarios that target an iOS device or simulator",
    "meta: per-test metadata (test_id, test_name) for dashboard tagging",
    "jira: link test to a Jira ticket id",
    "robotactions: scenarios that target the robotactions.com marketing site",
    "load: load-runner tagged scenarios",
    "mobileweb: browser-on-a-real-handset scenarios (PLATFORM=mobileweb|ios-mobileweb)",
]
