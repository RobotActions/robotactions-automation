name: zz-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: setup
        uses: RobotActions/robotactions-action@v0.1.0
        with:
          api-token: dummy-token-for-probe
          test-suite: probe
      - run: |
          set -euo pipefail
          test "${RA_GRID_URL}" = "https://grid.robotactions.com" || exit 1
          test "${RA_TESTSUITE}" = "probe" || exit 1
          echo "cross-repo action resolution OK"
