name: zz-probe
on:
  push:
    branches: [ci/use-robotactions-action]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: setup
        uses: RobotActions/robotactions-action@v0.2.0
        with:
          api-token: dummy-token-for-probe
          grid-url: grid.robotactions.com
          test-suite: probe
      - run: |
          set -euo pipefail
          # The names the template projects actually read.
          test "${GRID_URL}"  = "https://grid.robotactions.com" || { echo "GRID_URL=${GRID_URL}"; exit 1; }
          test "${GRID_HOST}" = "grid.robotactions.com"         || { echo "GRID_HOST=${GRID_HOST}"; exit 1; }
          test -n "${AUTH_TOKEN}"                               || { echo "AUTH_TOKEN unset"; exit 1; }
          test "${RA_TESTSUITE}" = "probe"                      || { echo "RA_TESTSUITE=${RA_TESTSUITE}"; exit 1; }
          echo "cross-repo resolution + template env OK"
