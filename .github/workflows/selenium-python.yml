name: selenium-python

# Manual dispatch only, for now. No push/PR trigger: every run consumes real
# devices and grid capacity, so it stays opt-in until we decide what should run
# automatically.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'PLATFORM — picks the driver'
        type: choice
        required: true
        default: mobileweb
        options:
          - mobileweb       # Chrome on a real Android device
          - ios-mobileweb   # Safari on a real iOS device
          - web             # Desktop Chrome via the grid
          - android         # Native Android app (UiAutomator2)
          - ios             # Native iOS app (XCUITest)
      test_path:
        description: 'pytest target (file or directory)'
        type: string
        required: true
        default: 'tests/step_defs/test_robotactions_mobileweb.py'
      markers:
        description: 'Marker expression, e.g. "smoke", "sanity", "smoke or sanity" (blank = all)'
        type: string
        required: false
        default: 'smoke'
      grid_url:
        description: 'Grid endpoint'
        type: string
        required: true
        default: ''
      browser_version:
        description: 'Chrome major version to target (web only — pins the grid stereotype)'
        type: string
        required: false
        default: '148'
      chrome_args:
        description: 'Extra Chrome flags, space separated (web only), e.g. "--lang=fr-FR --window-size=414,896"'
        type: string
        required: false
        default: ''

# One run at a time per platform — concurrent runs compete for the same handsets.
concurrency:
  group: selenium-python-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Session creation on a real handset can take minutes; keep the ceiling well
    # clear of the per-session timeouts.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: selenium-python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Used by the report-parsing steps below: stdlib ElementTree is
          # vulnerable to XXE / billion-laughs on untrusted XML.
          pip install defusedxml

      # Dispatch inputs are never interpolated into a run: block — that is a
      # command-injection shape. They go through env: and are quoted here.
      - name: Show run configuration
        env:
          PLATFORM: ${{ inputs.platform }}
          TEST_PATH: ${{ inputs.test_path }}
          MARKERS: ${{ inputs.markers }}
          GRID_URL: ${{ inputs.grid_url != '' && inputs.grid_url || secrets.RA_GRID_HOST }}
          RA_BROWSER_VERSION: ${{ inputs.browser_version }}
          RA_CHROME_ARGS: ${{ inputs.chrome_args }}
        run: |
          echo "platform       : $PLATFORM"
          echo "test path      : $TEST_PATH"
          echo "markers        : ${MARKERS:-<all>}"
          echo "grid           : $GRID_URL"
          echo "chrome version : $RA_BROWSER_VERSION"
          echo "chrome args    : ${RA_CHROME_ARGS:-<none>}"

      - name: Fail fast if the auth token is missing
        env:
          AUTH_TOKEN: ${{ secrets.RA_AUTH_TOKEN }}
        run: |
          if [ -z "$AUTH_TOKEN" ]; then
            echo "::error::secrets.RA_AUTH_TOKEN is not set — every session would 401." >&2
            exit 1
          fi

      - name: Run pytest
        env:
          PLATFORM: ${{ inputs.platform }}
          GRID_URL: ${{ inputs.grid_url != '' && inputs.grid_url || secrets.RA_GRID_HOST }}
          AUTH_TOKEN: ${{ secrets.RA_AUTH_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL }}
          RA_BROWSER_VERSION: ${{ inputs.browser_version }}
          RA_CHROME_ARGS: ${{ inputs.chrome_args }}
          RA_TESTSUITE: ${{ github.workflow }} · ${{ inputs.platform }} · run ${{ github.run_number }}
          TEST_PATH: ${{ inputs.test_path }}
          MARKERS: ${{ inputs.markers }}
          # GitHub sets CI=true, which the web fixture reads as "force headless".
          # That is wanted for PLATFORM=web and ignored by the mobile drivers.
        run: |
          args=("$TEST_PATH" -v --no-header --junitxml=reports/junit.xml)
          if [ -n "$MARKERS" ]; then
            args+=(-m "$MARKERS")
          fi
          python -m pytest "${args[@]}"

      # A marker expression that matches nothing exits 5 ("no tests collected"),
      # and a careless `|| true` would turn that into a green build that tested
      # nothing. Assert the JUnit XML actually contains results.
      - name: Guard against a zero-test run
        if: always()
        env:
          MARKERS: ${{ inputs.markers }}
        run: |
          report=reports/junit.xml
          if [ ! -s "$report" ]; then
            echo "::error::$report is missing or empty — no test produced a result." >&2
            exit 1
          fi
          total=$(python -c "from defusedxml.ElementTree import parse; r=parse('$report').getroot(); \
            print(sum(int(s.get('tests',0)) for s in r.iter('testsuite')))")
          echo "tests executed: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::0 tests matched markers '${MARKERS:-<all>}' — nothing ran." >&2
            exit 1
          fi

      - name: Summarise results
        if: always()
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          report=reports/junit.xml
          [ -s "$report" ] || exit 0
          {
            echo "### selenium-python · $PLATFORM"
            echo ""
            python - "$report" <<'PY'
          import sys
          from defusedxml.ElementTree import parse
          root = parse(sys.argv[1]).getroot()
          print("| Test | Result |")
          print("| --- | --- |")
          for case in root.iter("testcase"):
              bad = case.find("failure") is not None or case.find("error") is not None
              skipped = case.find("skipped") is not None
              mark = ":x: failed" if bad else (":fast_forward: skipped" if skipped else ":white_check_mark: passed")
              print(f"| {case.get('name')} | {mark} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ inputs.platform }}-${{ github.run_number }}
          path: |
            selenium-python/reports/
          retention-days: 14
